# Standalone mock MCP server crate — TEST FIXTURE ONLY, NOT a member of the
# `src-tauri` crate/workspace. The `rmcp` SERVER feature lives here only, so the
# production desktop crate stays client-only. Built on demand by tests / the
# conformance harness; never shipped.
[package]
name = "mock-mcp-server"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "mock_mcp_server"
path = "src/main.rs"

[dependencies]
rmcp = { version = "0.8", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
