[package]
name = "pragna2_desktop_app"
version = "1.0.4"
description = "Pragna2 Desktop Application"
authors = ["sgummalla"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pragna2_desktop_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-oauth = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cross-platform OS secure store for the auth refresh token: macOS Keychain +
# Windows Credential Manager (one API). See docs/TODO.md TD-009.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# Client-delegated stdio MCP host (Phase F). `rmcp` is the official Rust MCP
# SDK; we use it as a CLIENT over the child-process (stdio) transport to spawn
# local MCP servers, list their tools, and call them. `tokio` is its async
# runtime (process spawning + async stdio). See docs/specs/technical/client-delegated-stdio.md.
rmcp = { version = "0.8", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "macros", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

# TEST-ONLY. Integration tests under `tests/` are a separate crate and do not
# inherit the production `[dependencies]`, so they declare what they need here.
# Dev-dependencies NEVER compile into the shipped binary. The stdio MCP host
# integration tests (tests/mcp_*_it.rs) spawn the WI-1 mock fixture
# (test-fixtures/mock-mcp) — see pragna2-tracker #169.
[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

